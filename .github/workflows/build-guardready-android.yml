name: Build GuardReady Android APK

on:
  push:
    branches:
      - guardready-android-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GuardReady branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct GuardReady project
        run: |
          cat guardready-build/project.b64.* | base64 --decode > GuardReady-Android.zip
          mkdir android-project
          unzip -q GuardReady-Android.zip -d android-project

      - name: Pin compatible Android build toolchain
        working-directory: android-project
        run: |
          sed -i "s/version '9.3.0'/version '8.9.1'/" build.gradle
          sed -i 's/compileSdk 37/compileSdk 35/' app/build.gradle
          sed -i 's/targetSdk 37/targetSdk 35/' app/build.gradle

      - name: Build installable debug APK
        working-directory: android-project
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare GuardReady APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk GuardReady_CA.apk
          ls -lh GuardReady_CA.apk

      - name: Upload GuardReady APK
        uses: actions/upload-artifact@v4
        with:
          name: GuardReady-CA-Android-APK
          path: GuardReady_CA.apk
          if-no-files-found: error
          retention-days: 30
