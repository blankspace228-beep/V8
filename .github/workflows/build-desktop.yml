name: Build EMTReady NREMT Beta

on:
  push:
    branches: [emtready-nremt-beta]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare EMTReady desktop source
        run: python prepare_desktop.py
      - name: Install Electron packager
        run: npm install --save-dev --no-audit --no-fund electron@latest electron-builder@latest
      - name: Build Windows beta
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Rename Windows downloads
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -match "Setup" } | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -notmatch "Setup" } | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName "dist/EMTReady_NREMT_Beta_Windows_Setup.exe" }
          if ($portable) { Copy-Item $portable.FullName "dist/EMTReady_NREMT_Beta_Windows_Portable.exe" }
      - name: Upload Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: EMTReady-NREMT-Beta-Windows
          path: |
            dist/EMTReady_NREMT_Beta_Windows_Setup.exe
            dist/EMTReady_NREMT_Beta_Windows_Portable.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare EMTReady desktop source
        run: python3 prepare_desktop.py
      - name: Install Electron packager
        run: npm install --save-dev --no-audit --no-fund electron@latest electron-builder@latest
      - name: Build universal macOS beta
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Rename Mac downloads
        run: |
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          ZIP=$(find dist -maxdepth 1 -name '*.zip' | head -1)
          test -n "$DMG" && cp "$DMG" dist/EMTReady_NREMT_Beta_macOS_Universal.dmg
          test -n "$ZIP" && cp "$ZIP" dist/EMTReady_NREMT_Beta_macOS_Universal.zip
      - name: Upload Mac downloads
        uses: actions/upload-artifact@v4
        with:
          name: EMTReady-NREMT-Beta-macOS
          path: |
            dist/EMTReady_NREMT_Beta_macOS_Universal.dmg
            dist/EMTReady_NREMT_Beta_macOS_Universal.zip
          if-no-files-found: error
