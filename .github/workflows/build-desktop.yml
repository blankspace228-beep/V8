name: Build GuardReady License Beta

on:
  push:
    branches: [guardready-license-beta]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare GuardReady desktop source
        run: python prepare_desktop.py
      - name: Apply beta licensing layer
        run: python beta_patch.py
      - name: Install Electron packager
        run: npm install --save-dev --no-audit --no-fund electron@latest electron-builder@latest
      - name: Build Windows beta installer and portable app
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Rename Windows beta downloads
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -match "Setup" } | Select-Object -First 1
          $portable = Get-ChildItem dist -Filter "*.exe" | Where-Object { $_.Name -notmatch "Setup" } | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName "dist/GuardReady_CA_Beta_Windows_Setup.exe" }
          if ($portable) { Copy-Item $portable.FullName "dist/GuardReady_CA_Beta_Windows_Portable.exe" }
      - name: Upload Windows beta downloads
        uses: actions/upload-artifact@v4
        with:
          name: GuardReady-CA-Beta-Windows
          path: |
            dist/GuardReady_CA_Beta_Windows_Setup.exe
            dist/GuardReady_CA_Beta_Windows_Portable.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare GuardReady desktop source
        run: python3 prepare_desktop.py
      - name: Apply beta licensing layer
        run: python3 beta_patch.py
      - name: Install Electron packager
        run: npm install --save-dev --no-audit --no-fund electron@latest electron-builder@latest
      - name: Build universal macOS beta app
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Rename Mac beta downloads
        run: |
          DMG=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          ZIP=$(find dist -maxdepth 1 -name '*.zip' | head -1)
          test -n "$DMG" && cp "$DMG" dist/GuardReady_CA_Beta_macOS_Universal.dmg
          test -n "$ZIP" && cp "$ZIP" dist/GuardReady_CA_Beta_macOS_Universal.zip
      - name: Upload Mac beta downloads
        uses: actions/upload-artifact@v4
        with:
          name: GuardReady-CA-Beta-macOS
          path: |
            dist/GuardReady_CA_Beta_macOS_Universal.dmg
            dist/GuardReady_CA_Beta_macOS_Universal.zip
          if-no-files-found: error
