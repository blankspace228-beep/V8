name: Build EMT Ready Beta

on:
  push:
    branches: [emtready-beta]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct EMT Ready source
        shell: pwsh
        run: |
          $parts = Get-ChildItem emtready-build -Filter 'payload.*' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('emtready-source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive emtready-source.zip -DestinationPath . -Force
          if (-not (Test-Path 'emtready_beta/package.json')) { throw 'EMT Ready source reconstruction failed' }
      - name: Install Electron packager
        working-directory: emtready_beta
        run: npm install --save-dev --no-audit --no-fund electron@latest electron-builder@latest
      - name: Build Windows installer and portable app
        working-directory: emtready_beta
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Rename Windows downloads
        shell: pwsh
        run: |
          $installer = Get-ChildItem emtready_beta/dist -Filter '*.exe' | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
          $portable = Get-ChildItem emtready_beta/dist -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Setup' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          if (-not $portable) { throw 'Windows portable app not found' }
          Copy-Item $installer.FullName 'emtready_beta/dist/EMT_Ready_Beta_Windows_Setup.exe'
          Copy-Item $portable.FullName 'emtready_beta/dist/EMT_Ready_Beta_Windows_Portable.exe'
      - name: Upload Windows beta downloads
        uses: actions/upload-artifact@v4
        with:
          name: EMT-Ready-Beta-Windows
          path: |
            emtready_beta/dist/EMT_Ready_Beta_Windows_Setup.exe
            emtready_beta/dist/EMT_Ready_Beta_Windows_Portable.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct EMT Ready source
        run: |
          cat emtready-build/payload.* | tr -d '\n\r' | base64 --decode > emtready-source.zip
          unzip -q -o emtready-source.zip
          test -f emtready_beta/package.json
      - name: Install Electron packager
        working-directory: emtready_beta
        run: npm install --save-dev --no-audit --no-fund electron@latest electron-builder@latest
      - name: Build universal macOS app
        working-directory: emtready_beta
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Rename Mac downloads
        run: |
          DMG=$(find emtready_beta/dist -maxdepth 1 -name '*.dmg' | head -1)
          ZIP=$(find emtready_beta/dist -maxdepth 1 -name '*.zip' | head -1)
          test -n "$DMG" && cp "$DMG" emtready_beta/dist/EMT_Ready_Beta_macOS_Universal.dmg
          test -n "$ZIP" && cp "$ZIP" emtready_beta/dist/EMT_Ready_Beta_macOS_Universal.zip
      - name: Upload Mac beta downloads
        uses: actions/upload-artifact@v4
        with:
          name: EMT-Ready-Beta-macOS
          path: |
            emtready_beta/dist/EMT_Ready_Beta_macOS_Universal.dmg
            emtready_beta/dist/EMT_Ready_Beta_macOS_Universal.zip
          if-no-files-found: error
